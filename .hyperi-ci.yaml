#
# Override defaults with HYPERCI_* env vars.
# Reference: config/defaults.yaml in hyperi-ci.

# Category 4 (OSS): public, Apache-2.0, publishes to crates.io, neutral
# branding -- scalo carries no HyperI brand furniture. Declared rather than
# inferred: the prefix is a hint, never authority. The repo itself stays
# private until the consuming apps have migrated; the crate is already public.
classification: oss

language: rust
license: Apache-2.0
quality:
  enabled: true
  ignore:
    # Not reachable: the flaw is in W3C Baggage propagation, and scalo registers no text-map propagator (dfe-infra docs/THREAT-MODEL.md, accepted risks).
    - tool: osv-scanner
      id: GHSA-w9wp-h8wv-79jx
      reason: "CVE-2026-48504, opentelemetry_sdk 0.31.x: BaggagePropagator::extract_with_context is unreachable, as scalo registers no text-map propagator and never touches Baggage. The fix (0.32.1) waits on tracing-opentelemetry supporting 0.32 (renovate.json holds the 0.31 line). Drop on that bump."
test:
  enabled: true
  coverage: false
  rust:
    # Require process-per-test isolation rather than taking whatever the
    # runner has installed.
    nextest: true
    # Every feature, `testcontainers` included, so the real-broker tests run on
    # the Test job's Docker-capable runner.
    features: all
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets: []
release:
  enabled: true
