# Category 4 (OSS): public, Apache-2.0, publishes to crates.io, neutral branding.
classification: oss

language: rust
quality:
  enabled: true
  # The thin-chart skeleton renders only once an assembler adds files/contract.json.
  exclude_paths:
    - charts/scalo-service/skeleton
  # A consumer enables a narrow feature set, so a lint that fires or a test target that
  # fails to compile under one feature alone fails the stage rather than printing a
  # warning nobody reads.
  rust:
    feature_matrix:
      warnings: blocking
    feature_matrix_tests: blocking
  # Jobs of .github/workflows/scalo-service.yml, repeated so a local check predicts them.
  local_gates:
    - name: scalo-service chart tests
      command: ["charts/scalo-service/tests/run.sh"]
    - name: contract schema breaking-change check
      command: ["scripts/schema-breaking-check.sh"]
  ignore:
    # Not a vulnerability: the advisory marks chrono unmaintained, and deny.toml ignores it for the same reason.
    - tool: osv-scanner
      id: RUSTSEC-2026-0543
      reason: "chrono is unmaintained, not vulnerable, and no patched release exists. cel depends on it. Drop when the dependency graph no longer has chrono."
    # renovate.json is JSON, which has no comment syntax for a line-level nosemgrep.
    - tool: semgrep
      id: package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age
      reason: "renovate.json gives rdkafka and rdkafka-sys minimumReleaseAge 0 days on purpose: docs/deployment/native-deps.md records that they take each release with no cooldown. Every other packageRule sets 7 days."
test:
  enabled: true
  coverage: false
  # Logs memory and stalls during the test command, so a lost runner leaves evidence (#548).
  memory_watch:
    enabled: true
  rust:
    # Process-per-test isolation.
    nextest: true
    # Every feature, `testcontainers` included, so the real-broker tests run on
    # the Test job's Docker-capable runner.
    features: all
    # Windows and macOS lint every feature but Kafka's librdkafka and testcontainers' Docker.
    windows:
      features: &off_linux "auth,cli,cli-service,compression,compression-snappy,concurrency,config,config-reload,config-schema,dangerous-diagnostics,deployment,deployment-smoke,deployment-test-support,directory-config,directory-config-git,dlq,dlq-http,expression,geoip-download,governor,health,http,http-server,io,lifecycle,logger,memory,metrics,metrics-core,metrics-process,otel,otel-metrics,otel-tracing,output-file,rules,runtime,scaling,secrets,secrets-all,secrets-aws,secrets-vault,service-metrics,shutdown,sink-stack,spool,strmatch,tiered-sink,tls,top,transport,transport-file,transport-grpc,transport-grpc-vector-compat,transport-http,transport-kafka-config,transport-memory,transport-otlp,transport-pipe,transport-proxy,transport-proxy-test-support,transport-syslog,transport-test-support,transport-trace,version-check,worker,worker-batch,worker-msgpack,worker-pool,yaml"
      mode: clippy
    macos:
      features: *off_linux
      mode: clippy
  # A release runs the full tier: every real-broker and OpenBao test and the
  # docker builds. tests/TESTING.md says which tests are which.
  full:
    required_for_release: true
build:
  enabled: true
  strategies:
  - native
  rust:
    features: all
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
      - x86_64-pc-windows-msvc
      - aarch64-apple-darwin
    windows:
      features: *off_linux
    macos:
      features: *off_linux
    # The test compile's link stalled a free runner on memory at 3 cargo jobs (#548).
    free_memory_per_job_gib: 6
release:
  enabled: true
  # Named by exact directory: a glob skips library charts.
  helm:
    enabled: true
    charts:
      - charts/scalo-service
