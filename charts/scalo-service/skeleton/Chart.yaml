# The thin chart an assembler writes per app. It replaces name, version,
# appVersion, description and dependencies; everything else is copied as is.
apiVersion: v2
name: app-name
description: A service rendered by the scalo-service library chart from files/contract.json.
type: application
version: 0.0.0
appVersion: "0.0.0"
dependencies:
  - name: scalo-service
    version: 0.0.0
    repository: oci://registry.example.com/charts
