# No autoscaler: a fixed replica count, no spool, and the config mounted as one file.
keda:
  enabled: false
replicaCount: 3
commonAnnotations:
  ignore-check.kube-linter.io/no-anti-affinity: "library default pending scalo-rs#325"
configMount:
  subPath: true
config:
  spool:
    enabled: false
resources:
  limits:
    cpu: ""
