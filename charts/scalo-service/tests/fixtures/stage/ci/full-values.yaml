# Every extension point at once, so kubeconform sees each object the library can render.
fullnameOverride: event-stage-eu
partOf: pipeline
commonLabels:
  team: data
commonAnnotations:
  owner: data-team
  # KEDA owns the replica count, so the Deployment carries none and the linter reads 1.
  ignore-check.kube-linter.io/pdb-min-available: "replicas are KEDA-owned (keda.maxReplicaCount 20)"
podLabels:
  tier: stage
podAnnotations:
  sidecar.example.com/inject: "false"
imagePullSecrets:
  - registry-credentials
  - name: mirror-credentials
config:
  grpc:
    enabled: true
  buffer:
    flush_rows: 5000
configOverrides:
  loader:
    endpoint: loader:6000
extraEnv:
  RUST_LOG: info
extraEnvFrom:
  - secretRef:
      name: cloud-credentials
      optional: true
otel:
  endpoint: http://collector.observability:4317
versionCheck:
  enabled: false
reload:
  enabled: true
  secrets: ["broker-credentials"]
secrets:
  kafka:
    existingSecret: broker-credentials
keda:
  maxReplicaCount: 20
  extraTriggers:
    - type: metrics-api
      metricType: Value
      metadata:
        url: "http://pressure.{{ .Release.Namespace }}.svc:8080/pressure"
        targetValue: "70"
        valueLocation: value
  triggerAuthentication:
    secretTargetRef:
      - parameter: password
        name: broker-credentials
        key: password
pdb:
  minAvailable: 1
replicaCount: 2
publicService:
  enabled: true
  loadBalancerIP: 203.0.113.10
  udpLoadBalancerIP: 203.0.113.11
  loadBalancerSourceRanges: ["203.0.113.0/24"]
networkPolicy:
  enabled: true
fileSets:
  transforms:
    mountPath: /etc/event-stage-transforms
    files:
      - name: main.vrl
        content: ".message = upcase(string!(.message))\n"
nodeSelector:
  kubernetes.io/arch: arm64
tolerations:
  - key: dedicated
    operator: Equal
    value: pipeline
    effect: NoSchedule
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: event-stage-eu
initContainers:
  - name: wait
    image: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    command: ["sh", "-c", "echo {{ .Release.Namespace }}"]
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 32Mi}
    securityContext:
      readOnlyRootFilesystem: true
sidecars:
  - name: proxy
    image: envoyproxy/envoy:v1.39.2@sha256:460f8c329f24b2e1c7c5af64cb314a6f351ad1c262ba77b135ac46b35ebd5f85
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {memory: 128Mi}
    securityContext:
      readOnlyRootFilesystem: true
extraVolumes:
  - name: certs
    secret:
      secretName: event-stage-certs
extraVolumeMounts:
  - name: certs
    mountPath: /etc/certs
    readOnly: true
extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: "{{ .Release.Name }}-extra"
    data:
      namespace: "{{ .Release.Namespace }}"
