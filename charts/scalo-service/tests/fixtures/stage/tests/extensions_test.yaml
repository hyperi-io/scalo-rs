suite: network policy, file sets and extra objects
templates:
  - networkpolicy.yaml
  - filesets.yaml
  - extra-objects.yaml
  - deployment.yaml
release:
  name: release
  namespace: apps
tests:
  - it: renders no NetworkPolicy by default
    template: networkpolicy.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: admits private ports from the namespace and public ports from anywhere
    template: networkpolicy.yaml
    set:
      networkPolicy.enabled: true
    asserts:
      - equal:
          path: spec.podSelector.matchLabels
          value:
            app.kubernetes.io/name: event-stage
      - equal:
          path: spec.ingress
          value:
            - from:
                - podSelector: {}
              ports:
                - port: metrics
                  protocol: TCP
            - ports:
                - port: http
                  protocol: TCP
                - port: syslog
                  protocol: UDP

  - it: renders each file set as a ConfigMap and mounts it read-only
    set:
      fileSets:
        transforms:
          mountPath: /etc/event-stage-transforms
          files:
            - name: main.vrl
              content: "  .indented = true\n.flat = true\n"
    asserts:
      - equal:
          path: metadata.name
          value: event-stage-transforms
        template: filesets.yaml
      # base64 of "  .indented = true\n.flat = true\n"
      - equal:
          path: binaryData["main.vrl"]
          value: ICAuaW5kZW50ZWQgPSB0cnVlCi5mbGF0ID0gdHJ1ZQo=
        template: filesets.yaml
      - notExists:
          path: data
        template: filesets.yaml
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: fileset-transforms
            mountPath: /etc/event-stage-transforms
            readOnly: true
        template: deployment.yaml
      - exists:
          path: spec.template.metadata.annotations["checksum/files"]
        template: deployment.yaml

  # Helm deletes the text `<no value>` from rendered output, so a file sent as
  # plain data reaches the pod with `.tag = ""`. The expected value is the
  # base64 of the exact bytes set below, so equality is byte equality.
  - it: carries a file set's bytes unchanged, template text and non-ASCII included
    template: filesets.yaml
    set:
      fileSets:
        transforms:
          mountPath: /etc/event-stage-transforms
          files:
            - name: filebeat.vrl
              content: ".tag = \"<no value>\"\n.tpl = \"{{ .Values.secret }}\"\n.close = \"}}\"\n  .text = \"caf\u00e9 \u20ac \u00fc\"\n"
    asserts:
      - equal:
          path: binaryData["filebeat.vrl"]
          value: LnRhZyA9ICI8bm8gdmFsdWU+IgoudHBsID0gInt7IC5WYWx1ZXMuc2VjcmV0IH19IgouY2xvc2UgPSAifX0iCiAgLnRleHQgPSAiY2Fmw6kg4oKsIMO8Igo=

  - it: renders extraObjects through tpl
    template: extra-objects.yaml
    set:
      extraObjects:
        - apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ .Release.Name }}-extra"
          data:
            namespace: "{{ .Release.Namespace }}"
    asserts:
      - equal:
          path: metadata.name
          value: release-extra
      - equal:
          path: data.namespace
          value: apps
