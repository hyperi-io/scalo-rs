suite: configmap
templates:
  - configmap.yaml
tests:
  - it: renders an empty config when no value is set, never the contract's default_config
    asserts:
      - equal:
          path: metadata.name
          value: event-stage-config
      - equal:
          path: data["config.yaml"]
          value: "{}\n"

  - it: renders only the keys values set, with configOverrides winning
    set:
      config:
        buffer:
          flush_rows: 5000
        log_level: debug
      configOverrides:
        log_level: warn
        loader:
          endpoint: loader:6000
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            buffer:
              flush_rows: 5000
            loader:
              endpoint: loader:6000
            log_level: warn
