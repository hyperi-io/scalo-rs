suite: configmap
templates:
  - configmap.yaml
tests:
  # base64 of "{}\n"
  - it: renders an empty config when no value is set, never the contract's default_config
    asserts:
      - equal:
          path: metadata.name
          value: event-stage-config
      - equal:
          path: binaryData["config.yaml"]
          value: e30K
      - notExists:
          path: data

  # base64 of:
  #   buffer:
  #     flush_rows: 5000
  #   loader:
  #     endpoint: loader:6000
  #   log_level: warn
  - it: renders only the keys values set, with configOverrides winning
    set:
      config:
        buffer:
          flush_rows: 5000
        log_level: debug
      configOverrides:
        log_level: warn
        loader:
          endpoint: loader:6000
    asserts:
      - equal:
          path: binaryData["config.yaml"]
          value: YnVmZmVyOgogIGZsdXNoX3Jvd3M6IDUwMDAKbG9hZGVyOgogIGVuZHBvaW50OiBsb2FkZXI6NjAwMApsb2dfbGV2ZWw6IHdhcm4K

  # A null key is left out at every depth, inside list items too, so the app's own
  # default applies. The schema refuses a null dial, so these keys are not dials.
  # base64 of:
  #   buffer: {}
  #   routes:
  #   - name: a
  #   source:
  #     group_id: kept
  - it: drops a key set to null rather than writing null into the file
    set:
      config:
        buffer:
          spill_path: null
        trace_header: null
        routes:
          - name: a
            topic: null
        source:
          auto_offset_reset: null
          group_id: kept
    asserts:
      - equal:
          path: binaryData["config.yaml"]
          value: YnVmZmVyOiB7fQpyb3V0ZXM6Ci0gbmFtZTogYQpzb3VyY2U6CiAgZ3JvdXBfaWQ6IGtlcHQK

  # A hot path leaves the checksum only: the file the app reloads still holds it.
  # base64 of:
  #   rules:
  #     name: ingest
  - it: keeps a contract hot path in the mounted config file
    set:
      config:
        rules:
          name: ingest
    asserts:
      - equal:
          path: binaryData["config.yaml"]
          value: cnVsZXM6CiAgbmFtZTogaW5nZXN0Cg==

  # Helm deletes the text `<no value>` from rendered output, so a config sent as
  # plain data reaches the pod as `tag:`, a null. The expected value is the
  # base64 of:
  #   close: '}}'
  #   tag: <no value>
  #   text: <the UTF-8 text set below>
  #   tpl: '{{ .Values.secret }}'
  - it: carries config values unchanged, template text and non-ASCII included
    set:
      config:
        tag: "<no value>"
        tpl: "{{ .Values.secret }}"
        close: "}}"
        text: "caf\u00e9 \u20ac \u00fc"
    asserts:
      - equal:
          path: binaryData["config.yaml"]
          value: Y2xvc2U6ICd9fScKdGFnOiA8bm8gdmFsdWU+CnRleHQ6IGNhZsOpIOKCrCDDvAp0cGw6ICd7eyAuVmFsdWVzLnNlY3JldCB9fScK
