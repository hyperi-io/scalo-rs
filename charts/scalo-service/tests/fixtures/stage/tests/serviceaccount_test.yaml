suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
release:
  name: release
  namespace: apps
tests:
  - it: creates a ServiceAccount named after the chart, token unmounted, and runs the pod as it
    asserts:
      - hasDocuments:
          count: 1
        template: serviceaccount.yaml
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: event-stage
        template: serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: event-stage
        template: deployment.yaml

  - it: names the created account serviceAccount.name when set
    set:
      serviceAccount.name: stage-runner
    asserts:
      - equal:
          path: metadata.name
          value: stage-runner
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: stage-runner
        template: deployment.yaml

  - it: runs the pod as an account the operator supplies with create false and a name
    set:
      serviceAccount.create: false
      serviceAccount.name: platform-reader
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: platform-reader
        template: deployment.yaml

  - it: names no account with create false and no name, rather than one that does not exist
    set:
      serviceAccount.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: deployment.yaml
