suite: a contract whose service_account is none
templates:
  - serviceaccount.yaml
  - deployment.yaml
release:
  name: release
  namespace: apps
tests:
  - it: creates no ServiceAccount and names none, so the pod runs as the namespace default
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: deployment.yaml
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
        template: deployment.yaml

  - it: keeps the service-account files the token path holds
    template: deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: serviceaccount-files
            mountPath: /var/run/secrets/kubernetes.io/serviceaccount
            readOnly: true

  - it: runs the pod as the account serviceAccount.name names, and creates none
    set:
      serviceAccount.name: shared-reader
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: shared-reader
        template: deployment.yaml

  - it: creates the account after all when values set serviceAccount.create
    set:
      serviceAccount.create: true
    asserts:
      - hasDocuments:
          count: 1
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: static-site
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: static-site
        template: deployment.yaml
