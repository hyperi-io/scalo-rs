[graph]
targets = []
all-features = true

[advisories]
yanked = "warn"
ignore = [
    { id = "GHSA-qwgh-2vcv-g2f7", reason = "Reached via digest 0.10 <- sha1 <- aws-config, with scalo's aws-config feature on. The advisory needs a caught panic inside a hasher's compress callback followed by reuse of that buffer, and the SHA-1 compress does not panic. Drop when that chain moves to digest 0.11, which pulls block-buffer 0.12.1." },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "CC0-1.0",
    "Artistic-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]

# Some crates don't have standard SPDX identifiers
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
