# Project:   scalo
# File:      Cargo.toml
# Purpose:   Self-regulating runtime for data-plane services
# Language:  TOML
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "scalo"
# Placeholder: hyperi-ci stamps the release version here before it publishes and commits only VERSION back.
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "The runtime layer for Rust data-plane services: config, logging, metrics, health, backpressure and transports."
license = "Apache-2.0"
repository = "https://github.com/hyperi-io/scalo-rs"
documentation = "https://docs.rs/scalo"
# The crates.io page. README.md stays the GitHub front page.
readme = "docs/crate.md"
publish = true
keywords = ["data-plane", "backpressure", "observability", "kafka", "autoscaling"]
categories = ["asynchronous", "config", "network-programming", "concurrency", "development-tools"]
exclude = [".claude/", ".github/", "ci/", "ai/", "docs/", "examples/", "benches/", "scripts/", "charts/"]

[package.metadata.docs.rs]
# docs.rs has no librdkafka, libgit2, cmake or Docker, so list the features that build without them.
features = [
    "config", "config-reload", "logger", "yaml",
    "metrics-core", "metrics-process", "metrics", "service-metrics",
    "otel", "otel-metrics", "otel-tracing",
    "runtime", "shutdown", "health",
    "concurrency", "strmatch", "memory", "scaling",
    "io", "spool", "tiered-sink",
    "worker-pool", "worker-batch", "worker", "worker-msgpack",
    "cli", "cli-service",
    "http", "http-server",
    "transport", "transport-trace",
    "transport-memory", "transport-grpc", "transport-file",
    "transport-pipe", "transport-http", "transport-kafka-config",
    "directory-config",
    "secrets", "secrets-vault",
    "dlq", "dlq-http",
    "output-file",
    "deployment", "config-schema",
    "expression", "rules", "version-check",
    "geoip-download",
    "auth",
]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Feature tree and costs: docs/feature-flags.md.
default = ["config", "logger"]

health = []
shutdown = ["tokio", "tokio-util", "tracing"]
runtime = ["dirs"]
config = ["figment", "dotenvy", "yaml", "serde_json", "dirs", "tracing"]

yaml = ["dep:serde-saphyr", "dep:serde_ignored", "serde_json"]
logger = ["tracing", "tracing-subscriber", "owo-colors", "serde_json", "tracing-throttle"]

# docs/api/concurrency.md
concurrency = ["tokio", "tokio-util", "tracing", "metrics-core"]
strmatch = ["regex", "regex-automata", "regex-syntax", "aho-corasick", "memchr", "tracing", "metrics-core"]

# Tiers, and why `metrics` pulls the OTLP exporters: docs/core-pillars/metrics.md#feature-tiers.
metrics-core = ["dep:metrics", "tracing"]
metrics-process = ["metrics-core", "sysinfo"]
metrics = ["metrics-process", "metrics-exporter-prometheus", "dep:crossbeam-epoch", "tokio", "serde_json", "otel-metrics", "otel-tracing"]

# `metrics` enables `otel-metrics`, never the reverse: the other direction is a cargo feature cycle.
otel = ["dep:opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing", "tracing-opentelemetry", "serde_json"]
otel-metrics = ["otel", "metrics-process", "metrics-util", "metrics-exporter-opentelemetry", "opentelemetry_sdk/rt-tokio", "tokio", "dashmap"]
otel-tracing = ["otel", "opentelemetry_sdk/rt-tokio", "tokio", "tracing-subscriber"]

service-metrics = ["metrics"]

# `preserve_order` keeps an operator's file in key order when a table is written back.
directory-config = ["yaml", "serde_json/preserve_order", "tokio", "tracing"]
directory-config-git = ["directory-config", "git2"]

# `base64` encodes Basic auth for the signer, and `bytes` holds the body across retries.
http = ["reqwest", "serde_json", "dep:backon", "tokio", "base64", "bytes"]

# reqwest gates its `query` and `form` encoders, so this feature alone pays for them. docs/api/auth.md
auth = [
    "http",
    "serde_json",
    "dep:arc-swap",
    "tokio",
    "tracing",
    "reqwest/query",
    "reqwest/form",
]
http-server = ["axum", "tower", "tower-http", "tokio", "tracing"]
spool = ["yaque", "zstd", "dep:crc32c", "chrono", "tokio"]
tiered-sink = ["transport", "yaque", "zstd", "lz4_flex", "snap", "tokio", "tokio-util", "libc", "tracing", "dep:crc32c", "chrono"]

# docs/pipeline/sink-stack.md
sink-stack = ["transport", "tower", "dep:backon", "governor", "tokio", "tracing"]

memory = ["sysinfo", "tracing"]

# `gcra` is the `governor` crate, renamed so it does not clash with this feature. docs/self-regulation.md
governor = ["memory", "tokio", "parking_lot", "dep:gcra"]

scaling = ["parking_lot", "tracing"]

# docs/feature-flags.md#worker-pool
worker-pool = ["rayon", "config", "metrics", "tokio", "tokio-util", "sysinfo", "parking_lot", "tracing"]
worker-batch = ["worker-pool", "sonic-rs", "dashmap", "bytes", "dep:wide"]
worker = ["worker-batch"]

worker-msgpack = ["worker", "rmpv"]

# `cli-service` pulls no transport and no worker pool: docs/feature-flags.md#cli
cli = ["clap", "tracing"]
cli-service = ["cli", "metrics", "memory", "scaling", "shutdown", "governor", "lifecycle"]

# Folded into cli-service: docs/core-pillars/lifecycle.md
lifecycle = ["config", "tokio", "tracing"]
top = ["cli-service", "ratatui"]

io = ["file-rotate", "parking_lot", "chrono", "tracing", "tokio"]

# `wide` compiles parse_guard, which caps the depth of an original filed under `_json`.
dlq = ["io", "concurrency", "base64", "serde_json", "serde_json/raw_value", "tokio", "tokio-util", "tracing", "dep:wide"]
dlq-kafka = ["dlq", "transport-kafka"]
dlq-http = ["dlq", "reqwest"]

output-file = ["io", "serde_json", "tracing"]

expression = ["dep:cel", "serde_json"]

# docs/pipeline/rules.md
rules = ["expression", "strmatch", "sonic-rs", "memchr", "serde_json", "dep:wide", "tracing"]

deployment = ["yaml", "serde_json"]
# Needs a Docker daemon at test time.
deployment-smoke = ["deployment"]

# Test helpers for scalo's suites and its consumers': src/deployment/test_support.rs
deployment-test-support = ["deployment", "dotenvy", "dep:tempfile"]

# Needs a Docker daemon. CI's Test job builds every feature, so it runs them.
testcontainers = ["transport-kafka-test-support"]

# docs/reflectable-config-shape.md
config-schema = ["dep:schemars", "serde_json", "deployment"]

version-check = ["reqwest", "tokio", "serde_json", "tracing", "chrono", "dirs", "uuid"]

# `reqwest/query` sits here, not on `http`, so only this feature pays for `serde_urlencoded`.
geoip-download = ["http", "reqwest/query", "dep:flate2", "dep:tar", "tokio", "chrono", "tracing"]

config-reload = ["config", "parking_lot", "tokio", "tracing"]

transport = ["tokio", "serde_json", "rmpv", "chrono", "regex", "memchr", "sonic-rs", "parking_lot", "tracing", "metrics-core", "bytes", "dep:wide"]
transport-trace = ["transport", "dep:opentelemetry"]
transport-memory = ["transport"]
# Kafka config and token types with no librdkafka.
transport-kafka-config = ["transport"]
transport-kafka = ["transport-kafka-config", "rdkafka", "regex", "tokio-util"]
# Kafka fixtures for consumer test suites. Needs a Docker daemon at test time.
transport-kafka-test-support = ["transport-kafka", "deployment-test-support", "dep:tempfile", "tokio/process"]
transport-grpc = ["transport", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:tonic-prost-build", "dep:prost-build", "dep:tokio-stream", "dep:hyper-util"]
transport-grpc-vector-compat = ["transport-grpc"]
transport-file = ["transport", "io"]
transport-pipe = ["transport"]
transport-http = ["transport", "http"]
transport-all = ["transport-memory", "transport-kafka", "transport-grpc", "transport-file", "transport-pipe", "transport-http"]

secrets = ["tokio", "tokio-util", "serde_json", "parking_lot", "base64", "dirs", "tracing", "dep:aes-gcm", "dep:hkdf", "dep:sha2"]
secrets-vault = ["secrets", "vaultrs"]
secrets-aws = ["secrets", "aws-config", "aws-sdk-secretsmanager"]
secrets-all = ["secrets-vault", "secrets-aws"]

# docs/api/tls.md
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:webpki-roots", "dep:tokio-rustls", "dep:arc-swap", "tokio", "tracing"]

# Can leak secrets: not in `full`, off in every shipping build.
dangerous-diagnostics = []

full = ["config", "config-reload", "lifecycle", "logger", "metrics", "service-metrics", "otel", "otel-metrics", "otel-tracing", "runtime", "shutdown", "health", "http", "http-server", "spool", "tiered-sink", "sink-stack", "transport-all", "transport-trace", "transport-grpc-vector-compat", "secrets-all", "directory-config", "directory-config-git", "deployment", "config-schema", "version-check", "scaling", "memory", "worker", "cli-service", "io", "dlq", "dlq-kafka", "dlq-http", "output-file", "expression", "rules", "tls", "geoip-download", "auth"]

[dependencies]
serde = { version = ">=1.0.229, <2", features = ["derive"] }

thiserror = ">=2.0.21, <3"

dirs = { version = ">=7.0.0, <8", optional = true }

uuid = { version = ">=1.29.2, <2", features = ["v4", "v5"], optional = true }

# figment's `yaml` feature is off: it parses through unsafe-libyaml, so YAML reaches the cascade through src/config/yaml_file.rs.
figment = { version = ">=0.10.19, <0.11", features = ["toml", "json", "env"], optional = true }
dotenvy = { version = ">=0.15.7, <0.16", optional = true }

# Floor 2.1: it rejects a null list, map or struct, as the `scalo::yaml` docs say.
serde-saphyr = { version = ">=2.1.0, <3", optional = true }
serde_ignored = { version = ">=0.1.14, <0.2", optional = true }

dashmap = { version = ">=6.2.1, <7", optional = true }
serde_json = { version = ">=1.0.154, <2", optional = true }

# `preserve_order` keeps schema properties in declaration order, so `config.schema.*` is byte-deterministic.
schemars = { version = ">=1.2.3, <2", default-features = false, features = ["std", "derive", "preserve_order"], optional = true }

git2 = { version = ">=0.21.0, <0.22", optional = true }

cel = { version = ">=0.14.5, <0.15", features = ["json"], optional = true }

clap = { version = ">=4.6.7, <5", features = ["derive", "env"], optional = true }

tracing = { version = ">=0.1.44, <0.2", optional = true }
tracing-subscriber = { version = ">=0.3.23, <0.4", features = ["json", "env-filter", "fmt", "time"], optional = true }
owo-colors = { version = ">=4.4.0, <5", optional = true }
tracing-throttle = { version = ">=0.4.4, <0.5", default-features = false, optional = true }

# Held at 0.31, with metrics-exporter-opentelemetry below 0.2.2, which moved to 0.33: the otel crates
# do not interoperate across a minor (scalo-rs#281). The hold keeps opentelemetry_sdk below the
# GHSA-w9wp-h8wv-79jx fix, which nothing here reaches: scalo registers no text-map propagator.
opentelemetry = { version = ">=0.31.0, <0.32", optional = true }
opentelemetry_sdk = { version = ">=0.31.0, <0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = ">=0.31.1, <0.32", features = ["grpc-tonic", "http-proto", "metrics", "logs"], optional = true }
tracing-opentelemetry = { version = ">=0.32.1, <0.33", optional = true }

metrics = { version = ">=0.24.6, <0.25", optional = true }
metrics-exporter-prometheus = { version = ">=0.18.3, <0.19", default-features = false, optional = true }
# Frees the histogram blocks the Prometheus upkeep drains (see metrics::run_upkeep).
crossbeam-epoch = { version = ">=0.9.21, <0.10", optional = true }
metrics-util = { version = ">=0.20.4, <0.21", optional = true }
metrics-exporter-opentelemetry = { version = ">=0.2.1, <0.2.2", optional = true }
sysinfo = { version = ">=0.40.1, <0.41", optional = true }

tokio = { version = ">=1.54.1, <2", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "fs", "io-std", "io-util"], optional = true }
tokio-util = { version = ">=0.7.20, <0.8", optional = true }

# `default-features = false` drops native-tls and OpenSSL, and `rustls-tls` keeps HTTPS.
reqwest = { version = ">=0.13.5, <0.14", default-features = false, features = ["json", "rustls"], optional = true }
backon = { version = ">=1.6.0, <2", optional = true }

# Holds the cached `auth` credential: a hit is one atomic load and never parks.
arc-swap = { version = ">=1.9.4, <2", optional = true }

# An explicit aws-lc-rs provider: the graph has both aws-lc-rs and ring, so there is no single process
# default. `default-features = false` keeps ring out. Never below 0.23.45: RUSTSEC-2026-0285.
rustls = { version = ">=0.23.46, <0.24", default-features = false, features = ["aws_lc_rs", "tls12", "logging", "std"], optional = true }
rustls-native-certs = { version = ">=0.8.5, <0.9", optional = true }
rustls-pki-types = { version = ">=1.15.1, <2", features = ["std"], optional = true }
webpki-roots = { version = ">=1.0.11, <2", optional = true }
# The provider comes from the rustls entry above.
tokio-rustls = { version = ">=0.26.6, <0.27", default-features = false, features = ["logging", "tls12"], optional = true }

axum = { version = ">=0.8.9, <0.9", optional = true }
tower = { version = ">=0.5.3, <0.6", features = ["limit", "timeout", "load-shed", "retry", "util"], optional = true }
tower-http = { version = ">=0.7.1, <0.8", features = ["timeout", "trace", "limit"], optional = true }

chrono = { version = ">=0.4.45, <0.5", optional = true }

# The one MsgPack decode the parse path uses, with no serde_json bridge.
rmpv = { version = ">=1.3.1, <2", optional = true }

# tonic-prost is used by the code build.rs generates, which cargo-machete does not see.
# `tls-aws-lc` matches crate::tls's explicit provider.
tonic = { version = ">=0.14.9, <0.15", features = ["gzip", "tls-aws-lc", "tls-native-roots"], optional = true }
tonic-prost = { version = ">=0.14.9, <0.15", optional = true }
prost = { version = ">=0.14.4, <0.15", optional = true }
prost-types = { version = ">=0.14.4, <0.15", optional = true }
# A three-component floor: `net` does not exist before 0.1.1.
tokio-stream = { version = ">=0.1.19, <0.2", features = ["net"], optional = true }
# Endpoint::connect_with_connector_lazy takes it, so the connect timeout covers the TLS handshake.
hyper-util = { version = ">=0.1.21, <0.2", features = ["client-legacy", "tokio"], optional = true }

ratatui = { version = ">=0.30.2, <0.32", optional = true }

file-rotate = { version = ">=0.8.0, <0.9", optional = true }

libc = { version = ">=0.2.191, <0.3", optional = true }

flate2 = { version = ">=1.1.11, <2", optional = true }
tar = { version = ">=0.4.46, <0.5", optional = true }

# `recovery` clears locks a killed process left.
yaque = { version = ">=0.6.6, <0.7", optional = true, features = ["recovery"] }
zstd = { version = ">=0.14.3, <0.15", optional = true }
crc32c = { version = ">=0.6.9, <0.7", optional = true }

# Never below 0.12.1: RUSTSEC-2026-0041.
lz4_flex = { version = ">=0.14.0, <0.15", optional = true }
snap = { version = ">=1.1.2, <2", optional = true }

sonic-rs = { version = ">=0.5.10, <1", optional = true }

# The unsafe lives in wide/safe_arch, since this crate denies unsafe_code.
wide = { version = ">=1.7.1, <2", optional = true }

regex = { version = ">=1.13.1, <2", optional = true }
regex-automata = { version = ">=0.4.18, <0.5", optional = true }
regex-syntax = { version = ">=0.8.11, <0.9", optional = true }
aho-corasick = { version = ">=1.1.5, <2", optional = true }
memchr = { version = ">=2.8.3, <3", optional = true }

parking_lot = { version = ">=0.13.0, <0.14", optional = true }
tempfile = { version = ">=3.27.0, <4", optional = true }

# The `governor` crate, renamed so it does not clash with scalo's `governor` feature.
gcra = { package = "governor", version = ">=0.10.4, <0.11", optional = true }

rayon = { version = ">=1.12.0, <2", optional = true }
base64 = { version = ">=0.23.1, <0.24", optional = true }

# src/secrets/crypto.rs holds an envelope sealed by the 0.10 line, so an upgrade that cannot open the disk caches fails its tests.
aes-gcm = { version = ">=0.11.1, <0.12", optional = true }
hkdf = { version = ">=0.13.0, <0.14", optional = true }
sha2 = { version = ">=0.11.1, <0.12", optional = true }

# Never below 1.11.1: RUSTSEC-2026-0007.
bytes = { version = ">=1.12.1, <2", optional = true }

vaultrs = { version = ">=0.8, <0.9", optional = true }

# Default features off: the aws-sdk `rustls` feature pulls rustls 0.21 (RUSTSEC-2026-0098, -0099, -0104),
# and `default-https-client` takes rustls 0.23.
aws-config = { version = ">=1.13.0, <2", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"], optional = true }
# Floor 1.117: the first release to need aws-smithy-json 0.63.1.
aws-sdk-secretsmanager = { version = ">=1.125.0, <2", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }

# One `rdkafka` per target: `dynamic-linking` and `cmake-build` must never both reach rdkafka-sys.
# docs/deployment/native-deps.md
[target.'cfg(not(target_os = "macos"))'.dependencies]
rdkafka = { version = ">=0.39.0, <0.40", default-features = false, features = ["dynamic-linking", "tokio"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rdkafka = { version = ">=0.39.0, <0.40", default-features = false, features = ["cmake-build", "ssl-vendored", "zstd", "libz", "tokio"], optional = true }

[build-dependencies]
tonic-prost-build = { version = ">=0.14.9, <0.15", optional = true }
prost-build = { version = ">=0.14.4, <0.15", optional = true }

[dev-dependencies]
# `testing` carries InMemoryMetricExporter, which proves what the OTel recorder exports.
opentelemetry_sdk = { version = ">=0.31.0, <0.32", features = ["testing"] }
tokio = { version = ">=1.54.1, <2", features = ["full", "test-util"] }
tempfile = ">=3.27.0, <4"
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
pretty_assertions = ">=1.4.1, <2"
# `async_closure` for `async_with_vars`: env mutation is process-global and
# `std::env::set_var` is unsafe, which `#![deny(unsafe_code)]` refuses, so an
# async test that needs a scoped variable has no other route.
temp-env = { version = ">=0.3.6, <0.4", features = ["async_closure"] }
async-trait = ">=0.1.92, <0.2"
git2 = ">=0.21.0, <0.22"
rcgen = ">=0.14.10, <0.15"
# Builds msgpack test fixtures. The library decodes with rmpv.
rmp-serde = ">=1.3.1, <2"
proptest = ">=1.12.0, <2"
# The real-broker tests need a Docker daemon.
testcontainers = ">=0.27.0, <0.28"
testcontainers-modules = { version = ">=0.15.0, <0.16", features = ["kafka"] }
# Must match the optional `http` reqwest exactly: two reqwest builds in one graph is E0464 on the lib test target.
reqwest = { version = ">=0.13.5, <0.14", default-features = false, features = ["json", "rustls"] }
# Same declaration as the optional `http-server` dependency, for the reason above.
axum = ">=0.8.9, <0.9"
# Local refs only, so no HTTP resolver.
jsonschema = { version = ">=0.61.0, <0.62", default-features = false }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Suggests Duration::from_hours/from_mins/from_days -- all Rust 1.99+ APIs, above
# our MSRV, so the suggestion is unsatisfiable. Allowed crate-wide.
duration_suboptimal_units = "allow"

# Allows for test/bench/example code (these don't inherit lib.rs attributes)
doc_markdown = "allow"                    # Don't require backticks in doc comments
unnecessary_debug_formatting = "allow"    # Allow {:?} in examples
await_holding_lock = "allow"              # Common in test code with mocked locks
redundant_closure = "allow"               # Sometimes clearer in tests
redundant_closure_for_method_calls = "allow"  # Sometimes clearer in tests
needless_raw_string_hashes = "allow"      # Convenience in test strings
items_after_statements = "allow"          # Test helper structs defined where needed
inefficient_to_string = "allow"           # Clarity over micro-optimization in tests
unwrap_used = "allow"                     # Allowed in tests for cleaner assertions

[[bench]]
name = "config_benchmark"
harness = false

[[bench]]
name = "logger_benchmark"
harness = false

[[bench]]
name = "engine_benchmark"
harness = false
required-features = ["worker", "transport"]

# docs/vector-baselining.md
[[bench]]
name = "baseline"
harness = false
required-features = ["transport"]

[[bench]]
name = "filter_benchmark"
harness = false
required-features = ["transport-memory"]

[[bench]]
name = "parse_guard"
harness = false
required-features = ["transport"]

[[bench]]
name = "concurrency_patterns"
harness = false
required-features = ["concurrency"]

[[bench]]
name = "strmatch"
harness = false
required-features = ["strmatch"]

# Gated by scripts/bench-gate.sh: no median over 5% slower than the saved baseline.
[[bench]]
name = "rules_benchmark"
harness = false
required-features = ["rules"]

# The credential cache-hit path: a number for the record, not a CI gate.
[[bench]]
name = "auth_hit"
harness = false
required-features = ["auth"]

# Memory backpressure operational-test harness (not a product binary).
# Driven under a cgroup --memory limit by scripts/operational-mem-test.sh.
[[example]]
name = "mem_loadgen"
required-features = ["memory", "logger"]

# CPU oversubscription operational-test harness (not a product binary).
# Driven under a cgroup --cpus cap by scripts/operational-cpu-test.sh.
[[example]]
name = "cpu_loadgen"
required-features = ["worker"]

# Demo examples gate on the library modules they exercise, so a partial
# `--features` build skips them instead of erroring (CI runs `features: all`).
[[example]]
name = "quickstart"
required-features = ["config", "logger"]

[[example]]
name = "full_demo"
required-features = ["config", "logger", "metrics", "runtime"]

# Breaking-change gate over two JSON Schema files, driven by
# scripts/schema-breaking-check.sh against the last release tag.
[[example]]
name = "schema_breaking"
required-features = ["deployment"]
