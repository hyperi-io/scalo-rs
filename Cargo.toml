# Project:   scalo
# File:      Cargo.toml
# Purpose:   Self-regulating runtime for data-plane services
# Language:  TOML
#
# License:   Apache-2.0
# Copyright: (c) 2026 HYPERI PTY LIMITED

[package]
name = "scalo"
version = "2.12.0"
edition = "2024"
rust-version = "1.95"
description = "An integrated runtime for at scale data plane services. Attach and 'enterprise-up' your application."
license = "Apache-2.0"
repository = "https://github.com/hyperi-io/scalo-rs"
publish = true
keywords = ["data-plane", "backpressure", "observability", "kafka", "autoscaling"]
categories = ["asynchronous", "config", "network-programming", "concurrency", "development-tools"]
exclude = [".claude/", ".github/", "ci/", "ai/", "docs/", "examples/", "benches/", "scripts/"]

[package.metadata.docs.rs]
# `all-features = true` triggers transport-kafka (needs librdkafka-dev),
# directory-config-git (libgit2-dev), secrets-aws (aws-lc-sys cmake),
# deployment-smoke (Docker daemon).
# None of these are installed in the docs.rs sandbox. Enumerate the set
# of features that builds without system libraries instead. When a new
# pure-Rust feature lands, add it here.
features = [
    "config", "config-reload", "logger",
    "metrics-core", "metrics-process", "metrics", "service-metrics",
    "otel", "otel-metrics", "otel-tracing",
    "runtime", "shutdown", "health",
    "concurrency", "strmatch", "memory", "scaling",
    "io", "spool", "tiered-sink",
    "worker-pool", "worker-batch", "worker", "worker-msgpack",
    "cli", "cli-service",
    "http", "http-server",
    "transport", "transport-trace",
    "transport-memory", "transport-grpc", "transport-file",
    "transport-pipe", "transport-http",
    "directory-config",
    "secrets", "secrets-vault",
    "dlq", "dlq-http",
    "output-file",
    "deployment", "config-schema",
    "expression", "version-check",
    "geoip-download",
    "auth",
]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Trimmed in 2.6.0 — was [config, logger, metrics, runtime, shutdown, health],
# now just [config, logger]. Consumers needing more list explicitly. Shaves
# ~200 transitive deps off the I-just-want-config use case.
default = ["config", "logger"]

# Core features
health = []
shutdown = ["tokio", "tokio-util", "tracing"]
runtime = ["dirs"]
config = ["figment", "dotenvy", "serde_yaml_ng", "serde_json", "dirs", "tracing"]
logger = ["tracing", "tracing-subscriber", "owo-colors", "serde_json", "tracing-throttle"]

# Three generic async primitives (BackgroundSink, PeriodicWorker, ActorHandle).
# Foundational helpers for any module that does fire-and-forget durable
# writes, timer-driven loops, or stateful command-queue actors. See
# `src/concurrency/mod.rs` for the decision matrix.
concurrency = ["tokio", "tokio-util", "tracing", "metrics-core"]
strmatch = ["regex", "regex-automata", "regex-syntax", "aho-corasick", "memchr", "tracing", "metrics-core"]

# Metrics tiers (2.6.0 split). Consumers pay only for what they use:
# - metrics-core: emit-only (counter!/gauge!/histogram! macros work)
# - metrics-process: + cgroup-aware process gauges
# - metrics: + Prometheus scrape endpoint, OTLP metric push, OTLP span export
#
# Serving /metrics sends nothing to a collector, so composing the exporters
# into `metrics` keeps a service from silently having no telemetry path out.
# Opt out through config (`metrics.otel.enabled`, `otel_tracing.enabled`), not
# by omitting a feature. `metrics-process` is the tier below for a consumer
# that wants gauges without any exporter.
metrics-core = ["dep:metrics", "tracing"]
metrics-process = ["metrics-core", "sysinfo"]
metrics = ["metrics-process", "metrics-exporter-prometheus", "tokio", "serde_json", "otel-metrics", "otel-tracing"]

# OpenTelemetry support (modern observability)
# `otel` is the umbrella enabling all OTel SDK deps. `otel-metrics` exports
# Prometheus + custom metrics through OTLP. `otel-tracing` bridges the
# `tracing` ecosystem (`tracing::span!`, `#[instrument]`) to OTel spans
# exported via OTLP — closes the W3C distributed-tracing chain that the
# transport-layer traceparent propagation alone can't complete.
#
# `metrics` enables `otel-metrics`, never the reverse: `otel-metrics` pulls
# `metrics-process`, not `metrics`, because the other direction is a cargo
# feature cycle. On its own it is the push-only build, no Prometheus exporter.
otel = ["dep:opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "tracing", "tracing-opentelemetry", "serde_json"]
otel-metrics = ["otel", "metrics-process", "metrics-util", "metrics-exporter-opentelemetry", "opentelemetry_sdk/rt-tokio", "tokio"]
otel-tracing = ["otel", "opentelemetry_sdk/rt-tokio", "tokio", "tracing-subscriber"]

# Standard pipeline metric groups (opt-in).
service-metrics = ["metrics"]

# Directory config store (YAML directory-backed)
# File locking uses std::fs::File::{lock,unlock} (stable since Rust 1.89).
directory-config = ["serde_yaml_ng", "tokio", "tracing"]
directory-config-git = ["directory-config", "git2"]

# Extended features (P2)
# `base64` carries the Basic-auth credential encoder in http_client::signer:
# reqwest's own encoder is private and only reachable from a RequestBuilder,
# and a signer runs against a built Request. `bytes` holds the request body
# across retries, so an attempt clones a handle rather than the payload.
http = ["reqwest", "serde_json", "dep:backon", "tokio", "base64", "bytes"]

# Credential acquisition + placement (scalo-rs#84, #88). Sources cache and
# renew one credential under single-flight; placements are RequestSigner impls
# that put it on a request through the shared HttpClient retry loop.
#
# `reqwest/query` is the query placement's encoder and `reqwest/form` the token
# exchange's; both are feature-gated in reqwest 0.13 so only this feature pays
# for `serde_urlencoded`. No signing scheme is pulled in -- SigV4 and HMAC stay
# with their consumers as impls of the trait.
auth = [
    "http",
    "serde_json",
    "dep:arc-swap",
    "tokio",
    "tracing",
    "reqwest/query",
    "reqwest/form",
]
http-server = ["axum", "tower", "tower-http", "tokio", "tracing"]
spool = ["yaque", "zstd", "dep:crc32c", "chrono", "tokio"]
tiered-sink = ["transport", "yaque", "zstd", "lz4_flex", "snap", "tokio", "libc", "tracing", "dep:crc32c", "chrono"]

# Outbound sink-control stack: composes timeout + load-shed + concurrency-limit
# + retry/backoff + rate-limit around any transport sender via tower's
# ServiceBuilder. Opt-in; preserves at-least-once (whole-batch retry on
# transient failure, never acks before the sink confirms). Circuit-breaking is
# applied separately by the TieredSink's own breaker (no double-regulation).
sink-stack = ["transport", "tower", "dep:backon", "governor", "tokio", "tracing"]

# Cgroup-aware memory backpressure (OOM prevention)
memory = ["sysinfo", "tracing"]

# Unified self-regulation governor: a pressure seam that combines a HARD
# memory signal (never masked) with weighted SOFT signals under a
# hysteresis latch. Additive, default-off. Depends on MemoryGuard, so it
# implies `memory`. Pulls `tokio` for async waits, `parking_lot` for locks, and
# the `gcra` crate (the `governor` token-bucket lib, renamed to avoid the
# feature/crate name clash) for the rate limiter.
governor = ["memory", "tokio", "parking_lot", "dep:gcra"]

# Scaling pressure calculation (KEDA autoscaling)
scaling = ["parking_lot", "tracing"]

# Adaptive worker pool tiers (2.6.0 split):
# - worker-pool: just AdaptiveWorkerPool (rayon + tokio + sysinfo)
# - worker-batch: + BatchEngine (sonic-rs SIMD JSON, dashmap interning, bytes)
#   and the parse_guard depth pre-check (wide)
# - worker: back-compat alias for worker-batch (candidate for post-GA deprecation)
worker-pool = ["rayon", "config", "metrics", "tokio", "tokio-util", "sysinfo", "parking_lot", "tracing"]
worker-batch = ["worker-pool", "sonic-rs", "dashmap", "bytes", "dep:wide"]
worker = ["worker-batch"]

# Worker pool with msgpack batch serialisation support.
# Uses `rmpv` (native schema-less MsgPack value): the engine parse path decodes
# MsgPack in a single native decode -- no rmp_serde -> serde_json bridge.
worker-msgpack = ["worker", "rmpv"]

# CLI tiers (2.6.0 split):
# - cli: bare clap types -- CommonArgs, StandardCommand, VersionInfo, CliError,
#   output helpers. Useful for tooling-style CLIs that don't need a metrics
#   server, worker pool, or memory guard.
# - cli-service: + ServiceApp trait, run_app, ServiceRuntime (full service app
#   scaffolding). Enables metrics, memory, scaling, shutdown, governor,
#   sink-stack and lifecycle. The adaptive worker pool is not included: add
#   worker-pool for the pool, or worker-batch for the pool plus the batch
#   engine, and the runtime builds and wires it.
cli = ["clap", "tracing"]
cli-service = ["cli", "metrics", "memory", "scaling", "shutdown", "governor", "sink-stack", "lifecycle"]

# Idle-until-configured gate: an app deployed before it has work starts, stays
# Ready, opens no connections, and picks up the first config that gives it work.
# Folded into cli-service so no consumer needs a Cargo edit to get it.
lifecycle = ["config", "tokio", "tracing"]
# TUI metrics dashboard (ratatui + crossterm via ratatui re-export)
top = ["cli-service", "ratatui"]

# Shared NDJSON file I/O (used by dlq + output-file)
io = ["file-rotate", "parking_lot", "chrono", "tracing", "tokio"]

# Dead letter queue (file backend always available)
dlq = ["io", "concurrency", "base64", "serde_json", "tokio", "tokio-util", "tracing"]
dlq-kafka = ["dlq", "transport-kafka"]
dlq-http = ["dlq", "reqwest"]

# File output sink (local NDJSON file output)
output-file = ["io", "serde_json", "tracing"]

# CEL expression evaluation
expression = ["dep:cel", "serde_json"]

# Deployment contract validation (Helm chart + Dockerfile sync)
deployment = ["serde_yaml_ng", "serde_json"]
# Smoke-test helper that runs `docker build` + `docker run` against a
# generated Dockerfile. Requires Docker daemon at test time. Opt-in.
deployment-smoke = ["deployment"]

# Public reusable test helpers (probes, skip emitter, kind cluster guard) used
# by scalo's own e2e tests AND by downstream consumers writing their own
# contract-artefact e2e tests. See src/deployment/test_support.rs.
deployment-test-support = ["deployment"]

# Real-broker tests against testcontainers. Needs a Docker daemon at test time;
# CI's Test job builds with every feature, so it runs them.
testcontainers = []

# Reflectable config schema + capability catalog (scalo-rs#6). Derives a JSON
# Schema of the app `Config` via schemars and carries a hand-authored capability
# catalog the control plane reflects on to build per-endpoint CRUD forms.
# Pure-Rust, opt-in. Implies `deployment` (the contract carries + emits both).
config-schema = ["dep:schemars", "serde_json", "deployment"]

# Startup version check (calls a configured version API)
version-check = ["reqwest", "tokio", "serde_json", "tracing", "chrono", "dirs", "uuid"]

# GeoIP MMDB provisioning: resolve, freshness-check and download the databases
# an enrichment stage reads. Provisioning only -- no lookup engine, no MMDB
# reader. Rides the shared `http` HttpClient rather than a second HTTP stack;
# `flate2` and `tar` are the archive formats the providers publish in.
#
# `reqwest/query` is enabled here rather than on `http` so the token-auth
# provider can attach its credential through the request builder instead of a
# formatted URL; only this feature pays for `serde_urlencoded`.
geoip-download = ["http", "reqwest/query", "dep:flate2", "dep:tar", "tokio", "chrono", "tracing"]

# Config hot-reload (SharedConfig<T> + ConfigReloader<T>)
config-reload = ["config", "parking_lot", "tokio", "tracing"]

# Transport features (2.6.0 split):
# - transport: bare transport abstraction
# - transport-trace: + W3C traceparent propagation via opentelemetry
# Apps that send/receive but don't propagate distributed-trace context
# avoid pulling in the OpenTelemetry SDK.
transport = ["tokio", "serde_json", "rmpv", "chrono", "regex", "memchr", "sonic-rs", "parking_lot", "tracing", "metrics-core", "bytes", "dep:wide"]
transport-trace = ["transport", "dep:opentelemetry"]
transport-memory = ["transport"]
transport-kafka = ["transport", "rdkafka", "regex", "tokio-util"]
transport-grpc = ["transport", "dep:tonic", "dep:tonic-prost", "dep:prost", "dep:prost-types", "dep:tonic-prost-build", "dep:prost-build", "dep:tokio-stream", "dep:hyper-util"]
transport-grpc-vector-compat = ["transport-grpc"]
transport-file = ["transport", "io"]
transport-pipe = ["transport"]
transport-http = ["transport", "http"]
transport-all = ["transport-memory", "transport-kafka", "transport-grpc", "transport-file", "transport-pipe", "transport-http"]

# Secrets management
secrets = ["tokio", "serde_json", "parking_lot", "base64", "dirs", "tracing", "dep:aes-gcm", "dep:hkdf", "dep:sha2", "dep:rand_core"]
secrets-vault = ["secrets", "vaultrs"]
secrets-aws = ["secrets", "aws-config", "aws-sdk-secretsmanager"]
secrets-all = ["secrets-vault", "secrets-aws"]

# Unified TLS trust + client-config construction (src/tls.rs). Private-CA
# first: native + webpki + extra-PEM roots, explicit aws-lc-rs crypto provider.
# Opt-in; TLS-consuming transports enable it as they adopt the module.
tls = ["dep:rustls", "dep:rustls-native-certs", "dep:rustls-pki-types", "dep:webpki-roots", "tracing"]

# Diagnostics escape hatches that can leak secrets if mis-used.
# Off in every shipping build. NOT included in `full`. Operators
# opt-in deliberately for one-off debugging.
dangerous-diagnostics = []

# Full feature set
full = ["config", "config-reload", "lifecycle", "logger", "metrics", "service-metrics", "otel", "otel-metrics", "otel-tracing", "runtime", "shutdown", "health", "http", "http-server", "spool", "tiered-sink", "sink-stack", "transport-all", "transport-trace", "transport-grpc-vector-compat", "secrets-all", "directory-config", "directory-config-git", "deployment", "config-schema", "version-check", "scaling", "memory", "worker", "cli-service", "io", "dlq", "dlq-kafka", "dlq-http", "output-file", "expression", "tls", "geoip-download", "auth"]

[dependencies]
# Serialisation (always needed)
serde = { version = ">=1.0.228, <2", features = ["derive"] }

# Error handling
thiserror = ">=2.0.18, <3"

# Environment detection
dirs = { version = ">=6.0.0, <8", optional = true }

# Opt-in version-check instance id
uuid = { version = ">=1.16.0, <2", features = ["v4", "v5"], optional = true }

# Configuration
figment = { version = ">=0.10.19, <0.11", features = ["yaml", "toml", "json", "env"], optional = true }
dotenvy = { version = ">=0.15.7, <0.16", optional = true }

# Concurrent hash map (field interning)
dashmap = { version = ">=6.1, <7", optional = true }
serde_yaml_ng = { version = ">=0.10.0, <0.11", optional = true }
serde_json = { version = ">=1.0.149, <2", optional = true }

# JSON Schema derivation for the reflectable config-schema capability
# (`config-schema` feature, scalo-rs#6). schemars 1.2.1 web-checked 2026-07-13:
# active, MSRV 1.74 (< our 1.95). `preserve_order` keeps schema property order =
# struct declaration order, so emitted `config.schema.*` is byte-deterministic.
schemars = { version = ">=1.2.1, <2", default-features = false, features = ["std", "derive", "preserve_order"], optional = true }

# Git operations (for directory-config-git)
git2 = { version = ">=0.21.0, <0.22", optional = true }

# CEL expression evaluation
# Renamed from cel-interpreter — same project, same maintainers, near-identical API.
cel = { version = ">=0.13, <0.14", features = ["json"], optional = true }

# CLI framework
clap = { version = ">=4.5, <5", features = ["derive", "env"], optional = true }

# Logging
tracing = { version = ">=0.1.44, <0.2", optional = true }
tracing-subscriber = { version = ">=0.3.22, <0.4", features = ["json", "env-filter", "fmt", "time"], optional = true }
owo-colors = { version = ">=4.2.3, <5", optional = true }
tracing-throttle = { version = ">=0.4.2, <0.5", default-features = false, optional = true }

# OpenTelemetry (modern observability - OTLP native)
# Held at 0.31: metrics-exporter-opentelemetry 0.2.1, its newest crates.io
# release as of 2026-10-06, requires opentelemetry ^0.31, and the otel crates do
# not interoperate across a minor, so `otel-metrics` cannot build against a newer
# SDK. The exporter's main branch already targets 0.33 but is unreleased. Bump the
# whole stack together once that release ships (scalo-rs#281).
#
# The hold keeps opentelemetry_sdk below 0.32.1, which fixes GHSA-w9wp-h8wv-79jx
# (CVE-2026-48504, unbounded allocation in W3C Baggage propagation). Not reachable
# here: scalo registers no text-map propagator and never touches Baggage - trace
# context is carried by hand in src/transport/propagation.rs.
opentelemetry = { version = ">=0.31.0, <0.32", optional = true }
opentelemetry_sdk = { version = ">=0.31.0, <0.32", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = ">=0.31.0, <0.32", features = ["grpc-tonic", "http-proto", "metrics", "logs"], optional = true }
tracing-opentelemetry = { version = ">=0.32.1, <0.33", optional = true }

# Metrics (Prometheus-native)
metrics = { version = ">=0.24.5, <0.25", optional = true }
metrics-exporter-prometheus = { version = ">=0.18.3, <0.19", optional = true }
metrics-util = { version = ">=0.20.3, <0.21", optional = true }
metrics-exporter-opentelemetry = { version = ">=0.2.1, <0.3", optional = true }
sysinfo = { version = ">=0.39, <0.40", optional = true }

# Async runtime (for metrics server, http-server, shutdown)
tokio = { version = ">=1.50.0, <2", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "fs", "io-std", "io-util"], optional = true }
tokio-util = { version = ">=0.7.18, <0.8", optional = true }

# HTTP client. reqwest 0.13 + rustls. Retry/backoff is the `backon` crate
# (one backoff lib across the codebase) - retry middleware and its anyhow
# error-wrapper dep were retired in 2.10.
# `default-features = false` drops the `default-tls` feature (which pulls
# native-tls + openssl). The standard here is rustls everywhere — `rustls-tls`
# is enabled explicitly so the resulting client still talks HTTPS.
reqwest = { version = ">=0.13.3, <0.14", default-features = false, features = ["json", "rustls"], optional = true }
# Retry/backoff (GCRA-style exponential + jitter + dynamic Retry-After adjust).
# Apache-2.0, edition 2024, MSRV 1.85. Latest 1.6.0 web-checked 2026-06-26.
backon = { version = ">=1.6.0, <2", optional = true }

# Lock-free atomic Arc swap, holding the one cached credential the `auth`
# sources hand out. The tier list puts read-mostly state that is swapped whole
# on ArcSwap and rules out RwLock<Arc<T>>: a cache hit is then one atomic load
# and a pointer clone, and never parks. MIT/Apache-2.0, 1.9.2 web-checked
# 2026-09-16 (released 2026-06-28, actively maintained).
arc-swap = { version = ">=1.9.2, <2", optional = true }

# Unified TLS trust module (src/tls.rs, `tls` feature). All already present
# transitively (reqwest/aws-smithy pull rustls 0.23 + aws-lc-rs); these are
# direct optional deps so the module can build a ClientConfig with an EXPLICIT
# aws-lc-rs provider (the graph has both aws-lc-rs AND ring, so there is no
# unambiguous process-default provider). Versions web-checked 2026-06-03.
# `default-features = false` on rustls avoids pulling the `ring` provider in
# addition to `aws_lc_rs`. pki-types `std` enables CertificateDer PEM file IO.
# Floor is 0.23.45: RUSTSEC-2026-0285 patched there, and 0.23.40-0.23.44 accept
# TLS 1.3 handshake messages across an encryption-level boundary.
rustls = { version = ">=0.23.45, <0.24", default-features = false, features = ["aws_lc_rs", "tls12", "logging", "std"], optional = true }
rustls-native-certs = { version = ">=0.8.1, <0.9", optional = true }
rustls-pki-types = { version = ">=1.14, <2", features = ["std"], optional = true }
webpki-roots = { version = ">=1.0.7, <2", optional = true }

# HTTP server (axum)
axum = { version = ">=0.8.8, <0.9", optional = true }
tower = { version = ">=0.5.3, <0.6", features = ["limit", "timeout", "load-shed", "retry", "util"], optional = true }
tower-http = { version = ">=0.6.8, <0.8", features = ["timeout", "trace", "limit"], optional = true }

# Async (for transport)
chrono = { version = ">=0.4.43, <0.5", optional = true }

# Native schema-less MsgPack Value decode (transport codec + engine parse fast
# path). `3Hren/msgpack-rust` workspace, MIT, MSRV 1.85. The single decode the
# parse path uses -- no rmp_serde -> serde_json -> sonic_rs bridge.
# Web-checked 2026-06-04: latest 1.3.1, actively maintained.
rmpv = { version = ">=1.3.1, <2", optional = true }

# Kafka transport (dynamic-linking: use system librdkafka instead of compiling C++ from source)
rdkafka = { version = ">=0.39.0, <0.40", features = ["dynamic-linking"], optional = true }

# gRPC transport (tonic + prost)
# tonic-prost is used by the generated code in build.rs (vector.rs ProstCodec),
# not by hand-written source — cargo-machete won't see it but it's required.
# tls-aws-lc: client/server TLS on the aws-lc-rs backend (matches crate::tls's
# explicit provider). tls-native-roots: ClientTlsConfig::with_native_roots().
tonic = { version = ">=0.14.1, <0.15", features = ["gzip", "tls-aws-lc", "tls-native-roots"], optional = true }
tonic-prost = { version = ">=0.14.5, <0.15", optional = true }
prost = { version = ">=0.14, <0.15", optional = true }
prost-types = { version = ">=0.14, <0.15", optional = true }
# TcpListenerStream — lets GrpcTransport::new bind the listener synchronously
# and serve_with_incoming_shutdown, so server readiness is guaranteed on return.
# The `net` feature does not exist before 0.1.1, and tonic pins the real floor
# higher again, so this must stay a three-component floor.
tokio-stream = { version = ">=0.1.16, <0.2", features = ["net"], optional = true }
# The TCP connector tonic's channel is built on, handed to
# Endpoint::connect_with_connector_lazy so the connect timeout covers the TLS
# handshake too. Same crate and features tonic's `channel` feature already pulls.
hyper-util = { version = ">=0.1.20, <0.2", features = ["client-legacy", "tokio"], optional = true }

# TUI dashboard (ratatui re-exports crossterm)
ratatui = { version = ">=0.29, <0.32", optional = true }

# File rotation (for DLQ file backend)
file-rotate = { version = ">=0.7, <0.9", optional = true }

# Filesystem stats (disk-aware capacity management for tiered-sink)
libc = { version = ">=0.2.177, <0.3", optional = true }

# Gzip + tar decode for the GeoIP database archives the providers publish
# (`geoip-download`). flate2 is already in the graph via file-rotate; tar is
# pure Rust over the already-present filetime/libc/xattr.
flate2 = { version = ">=1.1.9, <2", optional = true }
tar = { version = ">=0.4.46, <0.5", optional = true }

# Spool (disk-backed async queue). yaque's last release is 0.6.6 (2023-11-04,
# crates.io API checked 2026-09-25). `recovery` clears locks a killed process left.
yaque = { version = ">=0.6.6, <0.7", optional = true, features = ["recovery"] }
zstd = { version = ">=0.13.3, <0.15", optional = true }
# Per-record spool integrity (hardware-accelerated CRC32C). Apache-2.0/MIT,
# 0.6.8 web-checked 2026-06-26. Closes the payload-integrity gap the queue's
# length-only header leaves open.
crc32c = { version = ">=0.6.8, <0.7", optional = true }

# TieredSink compression codecs
# Floor is 0.12.1: RUSTSEC-2026-0041 leaks uninitialised memory out of the block
# decompressor up to 0.11.5 and in 0.12.0, and 0.12.1 is the lowest release that
# no vulnerable range covers.
lz4_flex = { version = ">=0.12.1, <0.15", optional = true }
snap = { version = ">=1.1.1, <2", optional = true }

# SIMD JSON (BatchEngine — 2-4x faster than serde_json)
sonic-rs = { version = ">=0.5, <1", optional = true }

# Safe SIMD byte compares for the parse_guard depth pre-check; the unsafe lives in
# wide/safe_arch, since this crate denies unsafe_code. Zlib OR Apache-2.0 OR MIT,
# 1.7.1 released 2026-09-14 (crates.io API checked 2026-09-26).
wide = { version = ">=1.7.1, <2", optional = true }

# Regex (topic resolver include/exclude filters, strmatch)
regex = { version = ">=1.11, <2", optional = true }
regex-automata = { version = ">=0.4.8, <0.5", optional = true }
regex-syntax = { version = ">=0.8.5, <0.9", optional = true }
aho-corasick = { version = ">=1.1, <2", optional = true }
memchr = { version = ">=2.7.2, <3", optional = true }

# Secrets management
parking_lot = { version = ">=0.12.3, <0.13", optional = true }

# Token-bucket / GCRA rate limiter (governor crate). Imported as `gcra` to
# avoid a name clash with scalo's own `governor` module/feature (the crate and
# the feature would otherwise both be `governor`). Used by governor::rate_limit.
gcra = { package = "governor", version = ">=0.10.4, <0.11", optional = true }

# Data parallelism (CPU-bound work distribution for worker pool)
rayon = { version = ">=1.10, <2", optional = true }
base64 = { version = ">=0.22.1, <0.24", optional = true }

# AEAD for at-rest encryption of the secrets disk cache. Gated by
# the `secrets` feature; consumers without it pay nothing. AES-256-
# GCM picked because AES-NI gives sub-microsecond seal/open on
# modern x86, and the RustCrypto AEAD traits are well-vetted +
# FIPS-friendly.
aes-gcm = { version = "0.10", optional = true }
hkdf = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
rand_core = { version = "0.6", features = ["std"], optional = true }

# Zero-copy byte buffers (BatchEngine)
# Floor is 1.11.1: RUSTSEC-2026-0007 patched there, and BytesMut::reserve
# overflows below it, setting a capacity past the allocation.
bytes = { version = ">=1.11.1, <2", optional = true }

# Vault/OpenBao (for secrets-vault)
# Bumped to 0.8 in the 2026-05-08 reqwest-0.13 migration (see reqwest above).
vaultrs = { version = ">=0.8, <0.9", optional = true }

# AWS (for secrets-aws)
# NOTE: aws-config and aws-sdk-* transitively pull in aws-lc-sys, which compiles
# C/C++ and assembly. Amazon hardcode their own crypto lib into the SDK and offer
# no way to opt out at compile time. Every other C dependency in this crate is
# dynamically linked against system libs, but aws-lc-sys gets a free pass because
# apparently the AWS SDK team think we all enjoy watching cmake run. ~20-30s on
# first build, cached by sccache after that. Revisit when they offer a ring-only
# build — or when we find a reason to drop the AWS secrets backend entirely.
# Default features disabled to skip the aws-sdk `rustls` feature, which is
# confusingly named — it actually enables `aws-smithy-runtime/tls-rustls` and
# pulls in rustls 0.21 + rustls-webpki 0.101 (RUSTSEC-2026-0098, -0099, -0104).
# `default-https-client` uses the modern aws-smithy-http-client/rustls-aws-lc
# path with rustls 0.23 + rustls-webpki 0.103 — that's what we want.
aws-config = { version = ">=1.8, <2", default-features = false, features = ["default-https-client", "rt-tokio", "credentials-process", "sso"], optional = true }
# Floor is 1.117, the first release to require aws-smithy-json 0.63.1: 0.63.0 does
# not compile against the aws-smithy-types 1.7 Document::Object reshape (E0308).
aws-sdk-secretsmanager = { version = ">=1.117, <2", default-features = false, features = ["default-https-client", "rt-tokio"], optional = true }

[build-dependencies]
tonic-prost-build = { version = ">=0.14.5, <0.15", optional = true }
prost-build = { version = ">=0.14, <0.15", optional = true }

[dev-dependencies]
tokio = { version = ">=1.50.0, <2", features = ["full", "test-util"] }
tempfile = ">=3.24.0, <4"
criterion = { version = ">=0.8.2, <0.9", features = ["html_reports"] }
pretty_assertions = ">=1.4.1, <2"
# `async_closure` for `async_with_vars`: env mutation is process-global and
# `std::env::set_var` is unsafe, which `#![deny(unsafe_code)]` refuses, so an
# async test that needs a scoped variable has no other route.
temp-env = { version = ">=0.3.6, <0.4", features = ["async_closure"] }
async-trait = ">=0.1.88, <0.2"
git2 = ">=0.21.0, <0.22"
# Generate self-signed certs in-process for the `tls` module's unit tests
# (no checked-in PEM fixtures to rot). Web-checked 2026-06-03.
rcgen = ">=0.14.7, <0.15"
# Typed MsgPack encode -- only used by tests to build msgpack fixtures; the
# library parse path uses rmpv natively, so this is dev-only.
rmp-serde = ">=1.3.1, <2"
# Property-based testing (concurrency-control invariants: finalizer worst-status
# merge, etc.). MIT/Apache-2.0, 1.11.0 web-checked 2026-06-26.
proptest = ">=1.11.0, <2"
# Real-broker fault-injection (NO mocks): spin a Kafka container and
# stop/start it to drive the spill/circuit/drain + at-least-once paths. The
# `#[ignore]`d integration tests need a Docker daemon (run on a Docker host).
# MIT/Apache-2.0, web-checked 2026-06-26.
testcontainers = ">=0.27.0, <0.28"
testcontainers-modules = { version = ">=0.15.0, <0.16", features = ["kafka"] }
# Query Prometheus's own HTTP API in the scrape test, so the assertion is what
# Prometheus stored rather than what scalo rendered. Declaration must match the
# optional `http` dependency exactly -- two different reqwest builds in one
# graph is an E0464 on the lib test target.
reqwest = { version = ">=0.13.3, <0.14", default-features = false, features = ["json", "rustls"] }
# Serves the signer and credential-exchange integration tests from a real
# listener on an ephemeral port, so the assertions are what went over the wire.
# Same declaration as the optional `http-server` dependency for the reason the
# reqwest note above gives.
axum = ">=0.8.8, <0.9"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# expect_used = "warn"  # Disabled for MVP, re-enable for stricter error handling

# Suggests Duration::from_hours/from_mins/from_days -- all Rust 1.99+ APIs, above
# our MSRV, so the suggestion is unsatisfiable. Allowed crate-wide.
duration_suboptimal_units = "allow"

# Allows for test/bench/example code (these don't inherit lib.rs attributes)
doc_markdown = "allow"                    # Don't require backticks in doc comments
unnecessary_debug_formatting = "allow"    # Allow {:?} in examples
await_holding_lock = "allow"              # Common in test code with mocked locks
redundant_closure = "allow"               # Sometimes clearer in tests
redundant_closure_for_method_calls = "allow"  # Sometimes clearer in tests
needless_raw_string_hashes = "allow"      # Convenience in test strings
items_after_statements = "allow"          # Test helper structs defined where needed
inefficient_to_string = "allow"           # Clarity over micro-optimization in tests
unwrap_used = "allow"                     # Allowed in tests for cleaner assertions

[[bench]]
name = "config_benchmark"
harness = false

[[bench]]
name = "logger_benchmark"
harness = false

[[bench]]
name = "engine_benchmark"
harness = false
required-features = ["worker", "transport"]

# scalo-side numbers for Vector baselining (docs/vector-baselining.md).
[[bench]]
name = "baseline"
harness = false
required-features = ["transport"]

[[bench]]
name = "filter_benchmark"
harness = false
required-features = ["transport-memory"]

[[bench]]
name = "parse_guard"
harness = false
required-features = ["transport"]

[[bench]]
name = "concurrency_patterns"
harness = false
required-features = ["concurrency"]

[[bench]]
name = "strmatch"
harness = false
required-features = ["strmatch"]

# The credential cache-hit path: a number for the record, not a CI gate.
[[bench]]
name = "auth_hit"
harness = false
required-features = ["auth"]

# Memory backpressure operational-test harness (not a product binary).
# Driven under a cgroup --memory limit by scripts/operational-mem-test.sh.
[[example]]
name = "mem_loadgen"
required-features = ["memory", "logger"]

# CPU oversubscription operational-test harness (not a product binary).
# Driven under a cgroup --cpus cap by scripts/operational-cpu-test.sh.
[[example]]
name = "cpu_loadgen"
required-features = ["worker"]

# Demo examples gate on the library modules they exercise, so a partial
# `--features` build skips them instead of erroring (CI runs `features: all`).
[[example]]
name = "quickstart"
required-features = ["config", "logger"]

[[example]]
name = "full_demo"
required-features = ["config", "logger", "metrics", "runtime"]
