# markdownlint-cli2 configuration
# Ignores override the globs passed by CI action
ignores:
  - "node_modules/**"
  - ".venv/**"
  - "vendor/**"
  - "target/**"
  - "dist/**"
  - "build/**"
  - "CHANGELOG.md"
  - "**/CHANGELOG.md"
  - "ai/**"
  - "ci/**"

# This file replaces hyperi-ci's default rule set, so MD013 is off here too.
config:
  MD013: false
  # `compact`: the default pads every cell to the widest, which a 200+ char cell makes unreadable.
  MD060:
    style: "compact"
