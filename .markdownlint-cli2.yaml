# markdownlint-cli2 configuration
# Ignores override the globs passed by CI action
ignores:
  - "node_modules/**"
  - ".venv/**"
  - "vendor/**"
  - "target/**"
  - "dist/**"
  - "build/**"
  - "CHANGELOG.md"
  - "**/CHANGELOG.md"
  - "ai/**"
  - "ci/**"

# Owning this file opts scalo-rs out of hyperi-ci's own default rule set
# (src/hyperi_ci/config/markdownlint.yaml), which only applies when a repo
# has no markdownlint config of its own - so MD013 must be disabled here too.
# Markdown has no line-width limit in the house style: a paragraph is one
# line and the editor soft-wraps it.
config:
  MD013: false
